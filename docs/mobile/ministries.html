<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ministries | Petra Baptist Church</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #2e6aa9, #338cd0);
  min-height: 100vh;
  color: #fff;
}

/* App frame */
.app-frame {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-bottom: 160px;
}

/* Logo */
.logo-bar {
  padding: 10px 0 6px;
  width: 100%;
  text-align: center;
  flex-shrink: 0;
}

.logo-bar img {
  width: 80%;
  max-width: 300px;
  height: auto;
}

/* Page title */
.page-title {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin: 4px 0 12px;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
}

/* Ministry grid */
.ministry-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 14px;
}

.ministry-card {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 14px;
  padding: 18px 10px 14px;
  text-align: center;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.ministry-card:active {
  background: rgba(255,255,255,0.28);
  transform: scale(0.97);
}

.ministry-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #1a3a6b;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
  font-size: 22px;
  color: #e8d5a0;
}

.ministry-card h3 {
  margin: 0;
  font-size: 13px;
  font-weight: bold;
  line-height: 1.3;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
}

/* ── Modal ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  justify-content: center;
  align-items: flex-end;
}

.modal-overlay.active {
  display: flex;
}

.modal-sheet {
  background: #fff;
  color: #1d4f7a;
  width: 100%;
  max-width: 420px;
  border-radius: 22px 22px 0 0;
  padding: 20px 20px 30px;
  max-height: 75vh;
  overflow-y: auto;
  position: relative;
  animation: slideUp 0.25s ease;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}

.modal-close {
  position: absolute;
  top: 14px;
  right: 16px;
  background: none;
  border: none;
  font-size: 26px;
  color: #1d4f7a;
  cursor: pointer;
  line-height: 1;
  padding: 0;
}

.modal-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding-right: 30px;
}

.modal-header-icon {
  font-size: 28px;
  color: #2e6aa9;
  flex-shrink: 0;
}

.modal-header h2 {
  margin: 0;
  font-size: 20px;
  color: #1d4f7a;
}

.modal-section {
  margin-bottom: 14px;
}

.modal-section h4 {
  margin: 0 0 4px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #2e6aa9;
}

.modal-section p {
  margin: 0;
  font-size: 14px;
  line-height: 1.6;
  color: #333;
}

.external-btn {
  display: block;
  width: 100%;
  margin-top: 16px;
  padding: 13px;
  background: #2e6aa9;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}

/* ── Footer nav ── */
.footer-banner {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 420px;
  background: #1d4f7a;
  box-shadow: 0 -3px 8px rgba(0,0,0,0.35);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 0;
  z-index: 100;
}

.banner-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 4px 0;
}

.banner-row div {
  background: rgba(255,255,255,0.15);
  border-radius: 6px;
  padding: 10px 16px;
  font-weight: bold;
  cursor: pointer;
  font-size: 16px;
  color: white;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
  transition: background 0.3s, box-shadow 0.3s;
}

.banner-row div:hover  { background: rgba(255,255,255,0.3); }

.banner-row div.active {
  background: rgba(255,255,255,0.6);
  color: #1d4f7a;
  box-shadow: 0 0 12px rgba(255,255,255,0.9);
}

.banner-row div.home-btn {
  flex: 2.2;
  background: rgba(255,255,255,0.25);
  border: 1px solid rgba(255,255,255,0.5);
}

@media (max-width: 480px) {
  .banner-row div { font-size: 14px; padding: 8px 10px; }
}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<div class="app-frame">

  <div class="logo-bar">
    <img src="img/logo2.png" alt="Petra Baptist Church Logo" onerror="this.style.display='none'">
  </div>

  <div class="page-title">Our Ministries</div>

  <div class="ministry-grid" id="ministryGrid">
    <!-- Cards rendered dynamically from Google Sheet -->
    <div style="grid-column:1/-1; text-align:center; padding:30px; opacity:0.7; font-size:14px;">
      Loading ministries…
    </div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal-sheet" id="modalSheet">
    <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    <div class="modal-header">
      <div class="modal-header-icon" id="modalIcon">👔</div>
      <h2 id="modalTitle">Ministry</h2>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Footer Nav -->
<div class="footer-banner">
  <div class="banner-row">
    <div onclick="window.location.href='sermons.html'">Sermons</div>
    <div onclick="window.location.href='index.html'" class="home-btn">Home</div>
    <div onclick="window.location.href='bibles.html'">Bibles</div>
  </div>
  <div class="banner-row">
    <div class="active" onclick="window.location.href='ministries.html'">Ministries</div>
    <div onclick="window.location.href='flocknotes.html'">Flocknotes</div>
    <div onclick="window.location.href='prayer.html'">Prayer</div>
    <div onclick="window.location.href='give.html'">Give</div>
  </div>
  <div class="banner-row">
    <div onclick="window.location.href='facebook.html'">Facebook</div>
    <div onclick="window.location.href='contact.html'">Contact</div>
    <div onclick="window.location.href='events.html'">Events</div>
    <div onclick="window.location.href='songs.html'">Songs</div>
  </div>
</div>

<script>
// ── Google Sheet CSV URL ──────────────────────────────────────────────────
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0nMCiV-9ZI31hueyHzJPI7_3F95FMbuHTTcQbkYo_3DGA4z1LBuOk1IjtLyBAUSvhr05Jw4yq14GX/pub?gid=240712061&single=true&output=csv';

// ── Icon map: ministry name keywords → Font Awesome icon ─────────────────
const ICON_MAP = [
  { keys: ['men'],                icon: 'fa-user-tie'      },
  { keys: ['women'],              icon: 'fa-heart'         },
  { keys: ['teen','youth'],       icon: 'fa-user-friends'  },
  { keys: ['senior','saint'],     icon: 'fa-hands-helping' },
  { keys: ['kid','child'],        icon: 'fa-child'         },
  { keys: ['couple','marriage'],  icon: 'fa-ring'          },
  { keys: ['grief','share'],      icon: 'fa-dove'          },
  { keys: ['bible','fellowship'], icon: 'fa-book-open'     },
  { keys: ['worship','music'],    icon: 'fa-music'         },
  { keys: ['outreach','mission'], icon: 'fa-hands'         },
];

function iconForName(name) {
  const lower = name.toLowerCase();
  for (const entry of ICON_MAP) {
    if (entry.keys.some(k => lower.includes(k))) return entry.icon;
  }
  return 'fa-users';
}

// ── CSV parser (handles quoted fields with commas/newlines) ───────────────
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuote = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuote) {
      if (ch === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (ch === '"') inQuote = false;
      else field += ch;
    } else {
      if (ch === '"') { inQuote = true; }
      else if (ch === ',') { row.push(field.trim()); field = ''; }
      else if (ch === '\n') { row.push(field.trim()); rows.push(row); row = []; field = ''; }
      else if (ch !== '\r') { field += ch; }
    }
  }
  if (field || row.length) { row.push(field.trim()); rows.push(row); }
  return rows;
}

// ── Drive link → embeddable image URL ────────────────────────────────────
function driveUrl(raw) {
  if (!raw) return '';
  const m = raw.match(/[-\w]{25,}/);
  return m ? `https://lh3.googleusercontent.com/d/${m[0]}` : raw;
}

// ── Stored ministries for modal use ──────────────────────────────────────
let ministries = [];

// ── Fetch & render ────────────────────────────────────────────────────────
async function loadMinistries() {
  const grid = document.getElementById('ministryGrid');
  try {
    const res  = await fetch(SHEET_CSV_URL);
    const text = await res.text();
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error('No data');

    // Map headers (row 0) — skip Timestamp col
    const headers = rows[0].map(h => h.toLowerCase().trim());
    const col = name => headers.indexOf(name);

    const iName    = col('ministry name');
    const iAbout   = col('about');
    const iWhen    = col('when we meet');
    const iLoc     = col('location');
    const iLeader  = col('leader / contact name');
    const iEmail   = col('contact email (public)');
    const iImg1    = col('image link 1 (main / featured photo)');
    const iImg2    = col('image link 2');
    const iImg3    = col('image link 3');
    const iImg4    = col('image link 4');
    const iImg5    = col('image link 5');

    ministries = [];
    const dataRows = rows.slice(1).filter(r => r[iName] && r[iName].trim());

    dataRows.forEach((r, idx) => {
      ministries.push({
        idx,
        name:   r[iName]   || '',
        about:  r[iAbout]  || '',
        when:   r[iWhen]   || '',
        loc:    r[iLoc]    || '',
        leader: r[iLeader] || '',
        email:  r[iEmail]  || '',
        imgs:   [r[iImg1], r[iImg2], r[iImg3], r[iImg4], r[iImg5]]
                  .map(driveUrl).filter(Boolean)
      });
    });

    if (ministries.length === 0) throw new Error('Empty');

    grid.innerHTML = ministries.map((m, i) => {
      const icon    = iconForName(m.name);
      const imgHTML = m.imgs[0]
        ? `<img src="${m.imgs[0]}" alt="${m.name}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;" onerror="this.style.display='none'">`
        : `<i class="fas ${icon}"></i>`;
      return `
        <div class="ministry-card" onclick="openModal(${i})">
          <div class="ministry-icon">${imgHTML}</div>
          <h3>${m.name}</h3>
        </div>`;
    }).join('');

  } catch (e) {
    // Fallback to hardcoded data
    renderFallback();
  }
}

// ── Open modal ────────────────────────────────────────────────────────────
function openModal(idx) {
  const m = ministries[idx];
  if (!m) return;

  const icon = iconForName(m.name);
  const iconEl = document.getElementById('modalIcon');
  if (m.imgs[0]) {
    iconEl.innerHTML = `<img src="${m.imgs[0]}" alt="${m.name}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;" onerror="this.innerHTML='<i class=\'fas ${icon}\'></i>'">`;
  } else {
    iconEl.innerHTML = `<i class="fas ${icon}" style="font-size:28px;color:#2e6aa9;"></i>`;
  }
  document.getElementById('modalTitle').textContent = m.name;

  // Gallery (images 2–5)
  let galleryHTML = '';
  if (m.imgs.length > 1) {
    const extras = m.imgs.slice(1);
    galleryHTML = `
      <div class="modal-section">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
          ${extras.map(src => `<img src="${src}" style="width:80px;height:80px;border-radius:10px;object-fit:cover;" onerror="this.style.display='none'">`).join('')}
        </div>
      </div>`;
  }

  let html = `
    <div class="modal-section">
      <h4><i class="fas fa-info-circle" style="color:#2e6aa9;margin-right:6px;"></i>About</h4>
      <p>${m.about}</p>
    </div>
    ${galleryHTML}
    <div class="modal-section">
      <h4><i class="fas fa-clock" style="color:#2e6aa9;margin-right:6px;"></i>When We Meet</h4>
      <p>${m.when}</p>
    </div>`;

  if (m.loc) html += `
    <div class="modal-section">
      <h4><i class="fas fa-map-marker-alt" style="color:#2e6aa9;margin-right:6px;"></i>Location</h4>
      <p>${m.loc}</p>
    </div>`;

  if (m.leader) html += `
    <div class="modal-section">
      <h4><i class="fas fa-user" style="color:#2e6aa9;margin-right:6px;"></i>Leader</h4>
      <p>${m.leader}</p>
    </div>`;

  if (m.email) html += `
    <div class="modal-section">
      <h4><i class="fas fa-envelope" style="color:#2e6aa9;margin-right:6px;"></i>Contact</h4>
      <p><a href="mailto:${m.email}" style="color:#2e6aa9;">${m.email}</a></p>
    </div>`;

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Fallback (hardcoded) ──────────────────────────────────────────────────
function renderFallback() {
  const fallback = [
    { name:'Petra Men',             icon:'fa-user-tie',      about:"Our Men's Ministry is committed to empowering men to live out their God-given purpose with strength, integrity, and courage.", when:'Last Saturday of each month at 8:00 AM', loc:'', leader:'Brian Lee — Associate Pastor', email:'', imgs:[] },
    { name:'Petra Women',           icon:'fa-heart',         about:"The Women's Ministry exists to encourage, enlighten, equip, and energize women to walk in their God-given purpose.", when:'3rd Saturday of each month at 9:30 AM', loc:'', leader:'Carol Cooke', email:'', imgs:[] },
    { name:'Petra Teens',           icon:'fa-user-friends',  about:'Our Teen Ministry invites students in 6th–12th grade to dive into Scripture and grow in their faith.', when:'Wednesday Nights at 6:00 PM', loc:'', leader:'Tobias & Andrea Wilson', email:'', imgs:[] },
    { name:'Petra Senior Saints',   icon:'fa-hands-helping', about:'Senior Saints is dedicated to encouraging and equipping senior adults as vital members of the body of Christ.', when:'3rd Thursday of each month', loc:'', leader:'Debby Emerson', email:'', imgs:[] },
    { name:'Petra Kids',            icon:'fa-child',         about:"Our Kids Ministry provides a fun environment where children Pre-K through 5th grade can grow in God's Word.", when:'Wednesday Nights at 6:00 PM', loc:'', leader:'Stephanie Owens', email:'', imgs:[] },
    { name:'Petra Couples',         icon:'fa-ring',          about:'The Couples Ministry helps couples strengthen their relationship with Jesus Christ and one another.', when:'As Scheduled — see Flocknotes or Events', loc:'', leader:'Brian & Cheri Lee', email:'', imgs:[] },
    { name:'Petra Grief Share',     icon:'fa-dove',          about:'GriefShare is a caring weekly group designed to help individuals navigate the pain of losing a loved one.', when:'Sundays from 3:00–5:00 PM', loc:'', leader:'Carol Cooke', email:'', imgs:[] },
    { name:'Bible Fellowship Groups',icon:'fa-book-open',    about:"The Bible Fellowship Group helps you dig deeper into God's Word through meaningful study and discussion.", when:'Sundays at 8:00 AM', loc:'', leader:'', email:'', imgs:[] },
  ];
  ministries = fallback.map((m, idx) => ({ idx, ...m }));
  const grid = document.getElementById('ministryGrid');
  grid.innerHTML = ministries.map((m, i) => `
    <div class="ministry-card" onclick="openModal(${i})">
      <div class="ministry-icon"><i class="fas ${m.icon}"></i></div>
      <h3>${m.name}</h3>
    </div>`).join('');
}

// ── Init ──────────────────────────────────────────────────────────────────
loadMinistries();
</script>

</body>
</html>
